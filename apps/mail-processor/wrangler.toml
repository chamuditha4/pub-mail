name = "tmp-mail-processor"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Queue consumer (CLAUDE.md §3, §8): parses raw MIME from R2, sanitizes HTML,
# extracts attachments, and marks the message ready. Idempotent + retry-safe.

[vars]
APP_ENV = "staging"
# Dev-only key; production sets this as a Worker secret.
WEBHOOK_SECRET_ENCRYPTION_KEY = "REPLACE-ME-set-a-wrangler-secret-0000"

[[d1_databases]]
binding = "DB"
database_name = "tmp-mail"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "MAIL_RAW_BUCKET"
bucket_name = "tmp-mail-raw"

[[r2_buckets]]
binding = "MAIL_ATTACHMENT_BUCKET"
bucket_name = "tmp-mail-attachments"

[[queues.consumers]]
queue = "email-processing"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "email-processing-dlq"

# Webhook delivery: this Worker both enqueues (on message.ready) and consumes.
[[queues.producers]]
binding = "WEBHOOK_DELIVERY_QUEUE"
queue = "webhook-delivery"

[[queues.consumers]]
queue = "webhook-delivery"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 6
dead_letter_queue = "webhook-delivery-dlq"

# Retention sweep every 5 minutes (CLAUDE.md §13).
[triggers]
crons = ["*/5 * * * *"]
