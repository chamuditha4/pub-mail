name = "tmp-mail-web"
compatibility_date = "2024-12-30"

# Static single-page app served from Workers Assets. Deployed at app.example.com.
# NOTE: top-level keys must precede the [assets] table (TOML groups everything
# after a table header under that table).
routes = [{ pattern = "app.example.com", custom_domain = true }]
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
